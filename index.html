<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Timer 5 secondi – Gong</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101020;color:white;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center}.wrap{text-align:center;width:min(92vw,520px)}h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:650}#time{font-variant-numeric:tabular-nums;font-size:clamp(8rem,28vw,13rem);line-height:1.15;font-weight:800;margin:22px 0}button{border:0;border-radius:18px;background:#a78bfa;color:#111025;font-size:1.6rem;font-weight:800;padding:22px 40px;width:100%;cursor:pointer}button:active{transform:scale(.98)}p{color:#b8b7ca}#status{min-height:1.7em;font-weight:600;color:#d9c6ff}body.done{background:#173a33}</style></head><body><main class="wrap"><h1>Timer 5 secondi</h1><div id="time" aria-live="off">5</div><button id="start">START</button><p id="status">Premi START per iniziare</p><p>Un TIC ogni secondo e un GONG alla fine. Premi ancora per ricominciare.</p></main><script>let ctx,endAt,tick,playing=false,lastSecond=5;const display=document.getElementById('time'),button=document.getElementById('start'),status=document.getElementById('status');function gong(){const t=ctx.currentTime;const partials=[[220,0.6],[293.7,0.21],[440.9,0.13],[587.3,0.08],[740,0.05]];partials.forEach(([freq,amp],i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*(.992+i*.001),t+2.2);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.015+i*.004);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+2.85)});}function clickTick(){const t=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(1050,t);o.frequency.exponentialRampToValueAtTime(690,t+.055);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.1)}function reset(){clearInterval(tick);playing=false;display.textContent='5';document.body.classList.remove('done');button.textContent='START';status.textContent='Premi START per iniziare'}button.addEventListener('click',async()=>{if(playing){reset();return}try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){status.textContent='Audio non disponibile su questo browser';return}playing=true;document.body.classList.remove('done');button.textContent='ANNULLA';status.textContent='Conto alla rovescia';endAt=performance.now()+5000;display.textContent='5';lastSecond=5;clickTick();clearInterval(tick);tick=setInterval(()=>{const remaining=Math.max(0,Math.ceil((endAt-performance.now())/1000));display.textContent=remaining;if(remaining!==lastSecond){lastSecond=remaining;if(remaining>0)clickTick()}if(remaining===0){clearInterval(tick);playing=false;button.textContent='RICOMINCIA';status.textContent='TEMPO SCADUTO!';document.body.classList.add('done');gong()}},25)});</script></body></html>
